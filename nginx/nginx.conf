worker_processes auto;
pid /opt/homebrew/var/run/nginx.pid;
error_log /Users/k/Downloads/Samvaad_Final_APP/logs/nginx-error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;

    access_log /Users/k/Downloads/Samvaad_Final_APP/logs/nginx-access.log combined buffer=512k flush=1m;

    # ── Upstream: FastAPI backend ─────────────────────────────
    upstream backend {
        server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;
        root         /Users/k/Downloads/Samvaad_Final_APP/frontend/dist;
        index        index.html;

        # ── Large uploads (PDFs up to 200MB) ─────────────────
        client_max_body_size        200m;
        client_body_buffer_size     2m;
        proxy_request_buffering     on;
        proxy_buffering             off;

        # ── Gzip ─────────────────────────────────────────────
        gzip            on;
        gzip_types      text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
        gzip_min_length 1024;
        gzip_vary       on;

        # ── API proxy ────────────────────────────────────────
        location /api/ {
            proxy_pass  http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout    300s;
            proxy_send_timeout    60s;
            proxy_connect_timeout 10s;

            proxy_pass_header Authorization;
            proxy_set_header Authorization $http_authorization;
        }

        # ── Static assets with immutable caching ─────────────
        location /assets/ {
            expires    1y;
            add_header Cache-Control "public, immutable, no-transform";
            access_log off;
            try_files $uri =404;
        }

        # ── Favicon, images, fonts ───────────────────────────
        location ~* \.(ico|svg|png|jpg|jpeg|webp|woff2?|ttf|eot)$ {
            expires    30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
            try_files $uri =404;
        }

        # ── SPA fallback ─────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;

            location = /index.html {
                expires            -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate";
            }
        }
    }
}
