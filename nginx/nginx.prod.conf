# ── Samvaad PROD nginx (Phase 0 skeleton) ──────────────────────────
# Based on nginx.docker.conf. Deltas: TLS 443, rate-limits, 50m uploads,
# security headers. Certs mounted from /etc/letsencrypt (see compose prod).
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;

    access_log /var/log/nginx/access.log combined;

    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=chat:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;
    limit_req_status 429; # reject over-limit with 429, not default 503

    upstream backend {
        server backend:8002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen              443 ssl;
        http2               on;
        server_name         CHANGE_ME_YOUR_DOMAIN;
        root                /usr/share/nginx/html;
        index               index.html;

        ssl_certificate     /etc/letsencrypt/live/CHANGE_ME_YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME_YOUR_DOMAIN/privkey.pem;

        ssl_protocols                 TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers     on;
        ssl_ciphers                   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache             shared:SSL:10m;
        ssl_session_timeout           10m;

        # Align with backend MAX_UPLOAD_SIZE_MB=50
        client_max_body_size        50m;
        client_body_buffer_size     2m;
        proxy_request_buffering     on;
        proxy_buffering             off;

        # NOTE: any location with its own add_header must repeat the
        # security headers (nginx drops inherited add_header otherwise).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        gzip            on;
        gzip_types      text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
        gzip_min_length 1024;
        gzip_vary       on;

        location /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass  http://backend/api/auth/login;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
            proxy_connect_timeout 10s;
        }

        location /api/chat {
            limit_req zone=chat burst=10 nodelay;
            proxy_pass  http://backend/api/chat;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout    300s;
            proxy_send_timeout    60s;
            proxy_connect_timeout 10s;
            proxy_pass_header Authorization;
            proxy_set_header Authorization $http_authorization;
        }

        # Document uploads are CPU-heavy (parse + embed) — throttle separately.
        location ~ ^/api/documents/upload {
            limit_req zone=upload burst=5 nodelay;
            proxy_pass  http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout    300s;
            proxy_send_timeout    60s;
            proxy_connect_timeout 10s;
            proxy_pass_header Authorization;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/ {
            proxy_pass  http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout    300s;
            proxy_send_timeout    60s;
            proxy_connect_timeout 10s;
            proxy_pass_header Authorization;
            proxy_set_header Authorization $http_authorization;
        }

        location /assets/ {
            expires    1y;
            add_header Cache-Control "public, immutable, no-transform";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            access_log off;
            try_files $uri =404;
        }

        location ~* \.(ico|svg|png|jpg|jpeg|webp|woff2?|ttf|eot)$ {
            expires    30d;
            add_header Cache-Control "public, no-transform";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            access_log off;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
            location = /index.html {
                expires            -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate";
                add_header X-Content-Type-Options nosniff always;
                add_header X-Frame-Options DENY always;
                add_header Referrer-Policy no-referrer always;
                add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            }
        }
    }
}
